[project]
name = "mlops"
version = "0.1.0"
description = "Notebook workflow for pre-match win probability modeling"
readme = "notes.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel",
    "jupyter",
    "matplotlib",
    "nbconvert",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
