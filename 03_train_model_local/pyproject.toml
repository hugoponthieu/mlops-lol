    "mlflow==3.12.0",
    "tensorflow==2.21.0",
    "tensorboard==2.20.0",
    "matplotlib==3.10.9",
    "tf2onnx==1.17.0",
    "scikit-learn==1.8.0",
    "python-dotenv==1.2.2",
    "numpy==2.4.4",
    "onnx==1.21.0",
    "onnxruntime==1.26.0",
    "uv==0.11.12",
    "boto3==1.43.6",
