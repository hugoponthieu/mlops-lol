    inputDefinitions:
      artifacts:
        features_csv:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        preprocessing_joblib:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        test_csv:
