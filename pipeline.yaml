deploymentSpec:
  executors:
    exec-feature-engineering:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - feature_engineering
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==3.0.2'\
          \ 'numpy==2.4.4'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef build_feature_state(df, base_elo=1500):\n    \"\"\"Build initial\
          \ state from historical matches\"\"\"\n    import pandas as pd  # type:\
          \ ignore\n\n    state = {\n        \"elo\": {},\n        \"matches_played\"\
          : {},\n        \"win_history\": {},\n        \"h2h\": {},\n    }\n    #\
          \ Initialize Elo\n    teams = pd.concat([df[\"team_1\"], df[\"team_2\"]]).unique()\n\
          \    for team in teams:\n        state[\"elo\"][team] = base_elo\n     \
          \   state[\"matches_played\"][team] = 0\n        state[\"win_history\"][team]\
          \ = []\n    return state\n\n\ndef compute_features_for_match(match, state):\n\
          \    \"\"\"Compute feature vector for a single match\"\"\"\n    import numpy\
          \ as np  # type: ignore\n\n    team = match[\"team_1\"]\n    opp = match[\"\
          team_2\"]\n\n    # Elo diff\n    elo_team = state[\"elo\"].get(team, 1500)\n\
          \    elo_opp = state[\"elo\"].get(opp, 1500)\n    elo_diff = elo_team -\
          \ elo_opp\n\n    # Rolling winrates\n    winrate_10 = (\n        np.mean(state[\"\
          win_history\"].get(team, [])[-10:])\n        if len(state[\"win_history\"\
          ].get(team, [])) > 0\n        else 0\n    )\n    winrate_30 = (\n      \
          \  np.mean(state[\"win_history\"].get(team, [])[-30:])\n        if len(state[\"\
          win_history\"].get(team, [])) > 0\n        else 0\n    )\n    winrate_10_diff\
          \ = winrate_10 - (\n        np.mean(state[\"win_history\"].get(opp, [])[-10:])\n\
          \        if len(state[\"win_history\"].get(opp, [])) > 0\n        else 0\n\
          \    )\n    winrate_30_diff = winrate_30 - (\n        np.mean(state[\"win_history\"\
          ].get(opp, [])[-30:])\n        if len(state[\"win_history\"].get(opp, []))\
          \ > 0\n        else 0\n    )\n\n    # Experience / matches played\n    experience_diff\
          \ = state[\"matches_played\"].get(team, 0) - state[\n        \"matches_played\"\
          \n    ].get(opp, 0)\n\n    # Rank diff\n    rank_diff = match[\"rank_1\"\
          ] - match[\"rank_2\"]\n\n    # H2H winrate\n    h2h_key = (team, opp)\n\
          \    h2h_list = state[\"h2h\"].get(h2h_key, [])\n    h2h_winrate = np.mean(h2h_list)\
          \ if len(h2h_list) > 0 else 0.5\n\n    return {\n        \"elo_diff\": elo_diff,\n\
          \        \"winrate_10_diff\": winrate_10_diff,\n        \"winrate_30_diff\"\
          : winrate_30_diff,\n        \"experience_diff\": experience_diff,\n    \
          \    \"rank_diff\": rank_diff,\n        \"h2h_winrate\": h2h_winrate,\n\
          \    }\n\n\ndef update_state_with_result(match, state, k=32):\n    \"\"\"\
          Update Elo, rolling winrates, H2H after a match\"\"\"\n    team = match[\"\
          team_1\"]\n    opp = match[\"team_2\"]\n    result = int(match[\"match_winner\"\
          ] == 1)\n\n    # Update Elo\n    r_team = state[\"elo\"].get(team, 1500)\n\
          \    r_opp = state[\"elo\"].get(opp, 1500)\n    exp = 1 / (1 + 10 ** ((r_opp\
          \ - r_team) / 400))\n    state[\"elo\"][team] = r_team + k * (result - exp)\n\
          \    state[\"elo\"][opp] = r_opp + k * ((1 - result) - (1 - exp))\n\n  \
          \  # Update win history\n    state[\"win_history\"].setdefault(team, []).append(result)\n\
          \    state[\"win_history\"].setdefault(opp, []).append(1 - result)\n\n \
          \   # Update matches played\n    state[\"matches_played\"][team] = state[\"\
          matches_played\"].get(team, 0) + 1\n    state[\"matches_played\"][opp] =\
          \ state[\"matches_played\"].get(opp, 0) + 1\n\n    # Update H2H\n    h2h_key\
          \ = (team, opp)\n    state[\"h2h\"].setdefault(h2h_key, []).append(result)\n\
          \    return state\n\n\ndef feature_engineering(\n    matches_csv: Input[Dataset],\n\
          \    features_csv: Output[Dataset],\n):\n    import pandas as pd  # type:\
          \ ignore\n\n    matches = pd.read_csv(matches_csv.path)\n    matches[\"\
          date\"] = pd.to_datetime(matches[\"date\"])\n    matches = matches.sort_values(\"\
          date\").reset_index(drop=True)\n\n    # Build initial state\n    state =\
          \ build_feature_state(matches)\n    X = []\n    y = []\n\n    # Compute\
          \ features for each match\n    for _, match in matches.iterrows():\n   \
          \     features = compute_features_for_match(match, state)\n        X.append(features)\n\
          \        y.append(int(match[\"match_winner\"] == 1))\n        state = update_state_with_result(match,\
          \ state)\n\n    df_featured = pd.concat([matches, pd.DataFrame(X), pd.Series(y,\
          \ name=\"team_1_wins\")], axis=1)\n\n    df_featured.to_csv(features_csv.path,\
          \ index=False)\n\n"
        image: python:3.14
    exec-feature-preprocessing:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - feature_preprocessing
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==3.0.2'\
          \ 'scikit-learn==1.8.0' 'joblib==1.5.3' 'pygments==2.20.0'  &&  python3\
          \ -m pip install --quiet --no-warn-script-location 'kfp==2.16.1' '--no-deps'\
          \ 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"$0\" \"$@\"\
          \n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef feature_preprocessing(\n    features_csv: Input[Dataset],\n \
          \   train_csv: Output[Dataset],\n    test_csv: Output[Dataset],\n    preprocessing_joblib:\
          \ Output[Dataset],\n):\n    import pandas as pd\n\n    df = pd.read_csv(features_csv.path)\n\
          \    df[\"date\"] = pd.to_datetime(df[\"date\"])\n\n    split_date = df[\"\
          date\"].quantile(0.9)\n    df_train = df[df[\"date\"] <= split_date].copy()\n\
          \    df_test = df[df[\"date\"] > split_date].copy().reset_index()\n\n  \
          \  features = [\n        \"elo_diff\",\n        \"winrate_10_diff\",\n \
          \       \"winrate_30_diff\",\n        \"experience_diff\",\n        \"rank_diff\"\
          ,\n        \"h2h_winrate\",\n    ]\n    target = \"team_1_wins\"\n\n   \
          \ X_train = df_train[features]\n    y_train = df_train[target]\n    X_test\
          \ = df_test[features]\n    y_test = df_test[target]\n\n    from sklearn.pipeline\
          \ import Pipeline\n    from sklearn.impute import SimpleImputer\n    from\
          \ sklearn.preprocessing import StandardScaler\n    from sklearn.compose\
          \ import ColumnTransformer\n\n    numeric_pipeline = Pipeline(\n       \
          \ [(\"imputer\", SimpleImputer(strategy=\"median\")), (\"scaler\", StandardScaler())]\n\
          \    )\n    preprocessor = ColumnTransformer([(\"num\", numeric_pipeline,\
          \ features)])\n\n    X_train_scaled = pd.DataFrame(preprocessor.fit_transform(X_train),\
          \ columns=features)  # type: ignore\n    X_test_scaled = pd.DataFrame(preprocessor.transform(X_test),\
          \ columns=features)  # type: ignore\n\n    df_train_preprocessed = pd.concat([X_train_scaled,\
          \ y_train], axis=1)\n    df_test_preprocessed = pd.concat([X_test_scaled,\
          \ y_test], axis=1)\n\n    import joblib\n\n    # Save datasets\n    df_train_preprocessed.to_csv(train_csv.path,\
          \ index=False)\n    df_test_preprocessed.to_csv(test_csv.path, index=False)\n\
          \n    # Save preprocessor model\n    joblib.dump(preprocessor, preprocessing_joblib.path)\n\
          \n"
        image: python:3.14
    exec-feature-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - feature_train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kubeflow==0.4.0'\
          \ 'boto3==1.43.6' 'pandas==2.3.3' 'requests==2.33.1' 'urllib3==2.7.0' 'pygments==2.20.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef feature_train_model(\n    train_csv: Input[Dataset],\n    test_csv:\
          \ Input[Dataset],\n    model: Output[Model],\n    s3_bucket: str = \"mlops-bif\"\
          ,\n    s3_endpoint: str = \"https://b09595e7413d52541d55ebc0bf445b9c.r2.cloudflarestorage.com\"\
          ,\n    s3_region: str = \"auto\",\n    s3_prefix: str = \"kfp-runs\",\n\
          \    runtime_name: str = \"torch-distributed\",\n    num_nodes: int = 1,\n\
          \    learning_rate: float = 0.001,\n    dense_1_units: int = 64,\n    dense_2_units:\
          \ int = 16,\n    dropout: float = 0.3,\n    batch_size: int = 128,\n   \
          \ epochs: int = 100,\n    patience: int = 10,\n    validation_split: float\
          \ = 0.2,\n):\n    import json\n    import os\n    import time\n    import\
          \ uuid\n\n    import boto3\n    from kubeflow.trainer import (\n       \
          \ CustomTrainer,\n        Initializer,\n        S3DatasetInitializer,\n\
          \        TrainerClient,\n    )\n\n    access_key = os.environ[\"DVC_S3_ACCESS_KEY\"\
          ]\n    secret_key = os.environ[\"DVC_S3_SECRET_KEY\"]\n\n    run_id = uuid.uuid4().hex[:10]\n\
          \    data_prefix = f\"{s3_prefix}/{run_id}/data\"\n    model_prefix = f\"\
          {s3_prefix}/{run_id}/model\"\n\n    s3 = boto3.client(\n        \"s3\",\n\
          \        endpoint_url=s3_endpoint,\n        aws_access_key_id=access_key,\n\
          \        aws_secret_access_key=secret_key,\n        region_name=s3_region,\n\
          \    )\n    s3.upload_file(train_csv.path, s3_bucket, f\"{data_prefix}/train.csv\"\
          )\n    s3.upload_file(test_csv.path, s3_bucket, f\"{data_prefix}/test.csv\"\
          )\n    print(f\"Uploaded preprocessed CSVs to s3://{s3_bucket}/{data_prefix}/\"\
          )\n\n    def train_fn(\n        learning_rate: float,\n        dense_1_units:\
          \ int,\n        dense_2_units: int,\n        dropout: float,\n        batch_size:\
          \ int,\n        epochs: int,\n        patience: int,\n        validation_split:\
          \ float,\n        s3_bucket: str,\n        s3_endpoint: str,\n        s3_region:\
          \ str,\n        model_prefix: str,\n        access_key: str,\n        secret_key:\
          \ str,\n    ):\n        import json\n        import os\n\n        import\
          \ boto3\n        import pandas as pd\n        import torch\n        import\
          \ torch.nn as nn\n        from torch.utils.data import DataLoader, TensorDataset,\
          \ random_split\n\n        target = \"team_1_wins\"\n        df = pd.read_csv(\"\
          /workspace/dataset/train.csv\")\n        feature_columns = [c for c in df.columns\
          \ if c != target]\n        n_features = len(feature_columns)\n\n       \
          \ X = torch.tensor(df[feature_columns].values, dtype=torch.float32)\n  \
          \      y = torch.tensor(df[target].values, dtype=torch.float32).unsqueeze(1)\n\
          \        full_ds = TensorDataset(X, y)\n\n        val_size = max(1, int(len(full_ds)\
          \ * validation_split))\n        train_size = len(full_ds) - val_size\n \
          \       train_ds, val_ds = random_split(\n            full_ds, [train_size,\
          \ val_size], generator=torch.Generator().manual_seed(42)\n        )\n  \
          \      train_dl = DataLoader(train_ds, batch_size=batch_size, shuffle=True)\n\
          \        val_dl = DataLoader(val_ds, batch_size=batch_size)\n\n        net\
          \ = nn.Sequential(\n            nn.Linear(n_features, dense_1_units),\n\
          \            nn.ReLU(),\n            nn.Dropout(dropout),\n            nn.BatchNorm1d(dense_1_units),\n\
          \            nn.Linear(dense_1_units, dense_2_units),\n            nn.ReLU(),\n\
          \            nn.Dropout(dropout),\n            nn.BatchNorm1d(dense_2_units),\n\
          \            nn.Linear(dense_2_units, 1),\n        )\n        optimizer\
          \ = torch.optim.Adam(net.parameters(), lr=learning_rate)\n        loss_fn\
          \ = nn.BCEWithLogitsLoss()\n\n        best_val_loss = float(\"inf\")\n \
          \       best_state = None\n        epochs_since_improve = 0\n        final_metrics\
          \ = {}\n\n        for epoch in range(epochs):\n            net.train()\n\
          \            train_loss_sum, train_n = 0.0, 0\n            for xb, yb in\
          \ train_dl:\n                optimizer.zero_grad()\n                logits\
          \ = net(xb)\n                loss = loss_fn(logits, yb)\n              \
          \  loss.backward()\n                optimizer.step()\n                train_loss_sum\
          \ += loss.item() * xb.size(0)\n                train_n += xb.size(0)\n \
          \           train_loss = train_loss_sum / max(train_n, 1)\n\n          \
          \  net.eval()\n            val_loss_sum, val_correct, val_n = 0.0, 0, 0\n\
          \            with torch.no_grad():\n                for xb, yb in val_dl:\n\
          \                    logits = net(xb)\n                    val_loss_sum\
          \ += loss_fn(logits, yb).item() * xb.size(0)\n                    preds\
          \ = (torch.sigmoid(logits) >= 0.5).float()\n                    val_correct\
          \ += (preds == yb).sum().item()\n                    val_n += xb.size(0)\n\
          \            val_loss = val_loss_sum / max(val_n, 1)\n            val_acc\
          \ = val_correct / max(val_n, 1)\n            print(\n                f\"\
          epoch {epoch+1}/{epochs} train_loss={train_loss:.4f} \"\n              \
          \  f\"val_loss={val_loss:.4f} val_acc={val_acc:.4f}\"\n            )\n \
          \           final_metrics = {\n                \"train_loss\": train_loss,\n\
          \                \"val_loss\": val_loss,\n                \"val_accuracy\"\
          : val_acc,\n            }\n\n            if val_loss < best_val_loss - 1e-6:\n\
          \                best_val_loss = val_loss\n                best_state =\
          \ {k: v.detach().clone() for k, v in net.state_dict().items()}\n       \
          \         epochs_since_improve = 0\n            else:\n                epochs_since_improve\
          \ += 1\n                if epochs_since_improve >= patience:\n         \
          \           print(f\"Early stop at epoch {epoch+1}\")\n                \
          \    break\n\n        if best_state is not None:\n            net.load_state_dict(best_state)\n\
          \n        out_dir = \"/tmp/model_out\"\n        os.makedirs(out_dir, exist_ok=True)\n\
          \        torch.save(net.state_dict(), os.path.join(out_dir, \"model.pt\"\
          ))\n\n        net.eval()\n        dummy = torch.randn(1, n_features)\n \
          \       torch.onnx.export(\n            net,\n            dummy,\n     \
          \       os.path.join(out_dir, \"model.onnx\"),\n            input_names=[\"\
          input\"],\n            output_names=[\"logits\"],\n            opset_version=17,\n\
          \            dynamic_axes={\"input\": {0: \"batch\"}, \"logits\": {0: \"\
          batch\"}},\n        )\n\n        metadata = {\n            \"framework\"\
          : \"pytorch\",\n            \"framework_version\": torch.__version__,\n\
          \            \"task\": \"binary_classification\",\n            \"input_features\"\
          : feature_columns,\n            \"input_shape\": [None, n_features],\n \
          \           \"pt_file\": \"model.pt\",\n            \"onnx_file\": \"model.onnx\"\
          ,\n            \"onnx_opset\": 17,\n            \"hyperparameters\": {\n\
          \                \"learning_rate\": learning_rate,\n                \"dense_1_units\"\
          : dense_1_units,\n                \"dense_2_units\": dense_2_units,\n  \
          \              \"dropout\": dropout,\n                \"batch_size\": batch_size,\n\
          \                \"epochs\": epochs,\n                \"patience\": patience,\n\
          \                \"validation_split\": validation_split,\n            },\n\
          \            \"final_metrics\": final_metrics,\n        }\n        with\
          \ open(os.path.join(out_dir, \"metadata.json\"), \"w\") as f:\n        \
          \    json.dump(metadata, f)\n\n        s3c = boto3.client(\n           \
          \ \"s3\",\n            endpoint_url=s3_endpoint,\n            aws_access_key_id=access_key,\n\
          \            aws_secret_access_key=secret_key,\n            region_name=s3_region,\n\
          \        )\n        for fname in (\"model.pt\", \"model.onnx\", \"metadata.json\"\
          ):\n            s3c.upload_file(os.path.join(out_dir, fname), s3_bucket,\
          \ f\"{model_prefix}/{fname}\")\n        print(f\"Uploaded model artifacts\
          \ to s3://{s3_bucket}/{model_prefix}/\")\n\n    client = TrainerClient()\n\
          \    job_name = client.train(\n        runtime=client.get_runtime(runtime_name),\n\
          \        trainer=CustomTrainer(\n            func=train_fn,\n          \
          \  func_args={\n                \"learning_rate\": learning_rate,\n    \
          \            \"dense_1_units\": dense_1_units,\n                \"dense_2_units\"\
          : dense_2_units,\n                \"dropout\": dropout,\n              \
          \  \"batch_size\": batch_size,\n                \"epochs\": epochs,\n  \
          \              \"patience\": patience,\n                \"validation_split\"\
          : validation_split,\n                \"s3_bucket\": s3_bucket,\n       \
          \         \"s3_endpoint\": s3_endpoint,\n                \"s3_region\":\
          \ s3_region,\n                \"model_prefix\": model_prefix,\n        \
          \        \"access_key\": access_key,\n                \"secret_key\": secret_key,\n\
          \            },\n            packages_to_install=[\n                \"torch\"\
          ,\n                \"pandas\",\n                \"boto3\",\n           \
          \     \"onnx\",\n            ],\n            num_nodes=num_nodes,\n    \
          \    ),\n        initializer=Initializer(\n            dataset=S3DatasetInitializer(\n\
          \                storage_uri=f\"s3://{s3_bucket}/{data_prefix}\",\n    \
          \            endpoint=s3_endpoint,\n                access_key_id=access_key,\n\
          \                secret_access_key=secret_key,\n                region=s3_region,\n\
          \            )\n        ),\n    )\n    print(f\"Submitted TrainJob: {job_name}\"\
          )\n\n    terminal_success = {\"succeeded\", \"complete\"}\n    terminal_failure\
          \ = {\"failed\", \"error\"}\n    while True:\n        info = client.get_job(job_name)\n\
          \        status_obj = getattr(info, \"status\", info)\n        status_str\
          \ = str(status_obj).lower()\n        print(f\"TrainJob status: {status_obj}\"\
          )\n        if any(s in status_str for s in terminal_success):\n        \
          \    break\n        if any(s in status_str for s in terminal_failure):\n\
          \            try:\n                for line in client.get_job_logs(job_name):\n\
          \                    print(line)\n            except Exception as e:\n \
          \               print(f\"(could not stream logs: {e})\")\n            raise\
          \ RuntimeError(f\"TrainJob {job_name} failed with status {status_obj}\"\
          )\n        time.sleep(15)\n\n    try:\n        for line in client.get_job_logs(job_name):\n\
          \            print(line)\n    except Exception as e:\n        print(f\"\
          (log streaming after completion failed: {e})\")\n\n    os.makedirs(model.path,\
          \ exist_ok=True)\n    for fname in (\"model.pt\", \"model.onnx\", \"metadata.json\"\
          ):\n        s3.download_file(s3_bucket, f\"{model_prefix}/{fname}\", os.path.join(model.path,\
          \ fname))\n\n    with open(os.path.join(model.path, \"metadata.json\"))\
          \ as f:\n        md = json.load(f)\n    for k, v in md.items():\n      \
          \  model.metadata[k] = v\n    model.metadata[\"trainjob_name\"] = job_name\n\
          \    model.metadata[\"s3_model_uri\"] = f\"s3://{s3_bucket}/{model_prefix}\"\
          \n\n"
        image: python:3.12
    exec-pull-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - pull_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.3.3'\
          \ 'boto3==1.43.6' 'requests==2.33.1' 'urllib3==2.7.0' 'pygments==2.20.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef pull_data(\n    matches_csv: Output[Dataset],\n    s3_bucket:\
          \ str = \"mlops-bif\",\n    s3_key: str = \"data/raw/dataset.csv\",\n  \
          \  s3_endpoint: str = \"https://b09595e7413d52541d55ebc0bf445b9c.r2.cloudflarestorage.com\"\
          ,\n    s3_region: str = \"auto\",\n):\n    import os\n\n    import boto3\n\
          \n    s3 = boto3.client(\n        \"s3\",\n        endpoint_url=s3_endpoint,\n\
          \        aws_access_key_id=os.environ[\"DVC_S3_ACCESS_KEY\"],\n        aws_secret_access_key=os.environ[\"\
          DVC_S3_SECRET_KEY\"],\n        region_name=s3_region,\n    )\n    s3.download_file(s3_bucket,\
          \ s3_key, matches_csv.path)\n    print(f\"Downloaded s3://{s3_bucket}/{s3_key}\
          \ to {matches_csv.path}\")\n\n"
        image: python:3.12
pipelineInfo:
