#    runtime_name: str [Default: 'torch-distributed']
#    s3_bucket: str [Default: 'mlops-bif']
#    s3_dataset_key: str [Default: 'data/raw/dataset.csv']
#    s3_endpoint: str [Default: 'https://b09595e7413d52541d55ebc0bf445b9c.r2.cloudflarestorage.com']
#    s3_prefix: str [Default: 'kfp-runs']
#    s3_region: str [Default: 'auto']
#    validation_split: float [Default: 0.2]
